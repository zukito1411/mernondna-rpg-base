<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#17120d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="app-icon.svg" />
    <link rel="apple-touch-icon" href="icons/mernondna-192.png" />
    <title>Mernodna</title>
  </head>
  <body>
    <div id="root"><p style="padding:24px;color:#f4dfae;font-family:Georgia,serif">Preparing Mernodna…</p></div>
    <script>
      (()=>{
        const report=()=>{
          const root=document.getElementById('root');if(!root)return;
          root.replaceChildren();const box=document.createElement('section');box.style.cssText='padding:24px;color:#f4dfae;font-family:Georgia,serif';
          const text=document.createElement('p');text.textContent='Mernodna could not finish loading. Reconnect to the app’s host and retry. Your save has not been deleted.';
          const retry=document.createElement('button');retry.textContent='Retry opening';retry.onclick=()=>location.reload();box.append(text,retry);root.append(box);
        };
        window.addEventListener('mernondna-startup-error',report);
        window.addEventListener('error',event=>{if(event.target instanceof HTMLScriptElement)report();},true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
