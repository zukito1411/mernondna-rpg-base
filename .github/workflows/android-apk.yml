name: Build and publish Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Retain the development signing identity between CI builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-signing-v1
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;34.0.0'
      - name: Install dependencies and check current regressions
        run: |
          npm ci
          npm run test:types
          npm test -- tests/dragonBreath.test.ts tests/passageStory.test.ts tests/travelRoutes.test.ts tests/questProgress.test.ts tests/contentStreaming.test.ts
      - name: Build web assets and sync Android
        run: npm run cap:android:refresh
      - name: Build installable APK
        working-directory: android
        run: bash gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Verify and prepare downloads
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Tales-of-Leighneron.apk
          sha256sum Tales-of-Leighneron.apk > Tales-of-Leighneron.apk.sha256
          cat > release-notes.md <<'NOTES'
          Installable Android debug build, including the updated dragon breath sprites and animations, crewed boat passages, world traffic, quests and cutscenes.

          Download Tales-of-Leighneron.apk below and open it on your Android device. Requires Android 6.0 or newer. The APK includes the game assets and does not need a running development server.

          This is a development build. CI reuses its cached debug signing identity. An earlier APK built locally may have a different signature; Android can reject an update between those two builds. Uninstalling the earlier app also removes its local saves.

          The accompanying SHA-256 file lets you verify your download.
          NOTES
      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="android-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$release_tag" Tales-of-Leighneron.apk Tales-of-Leighneron.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Android build ${GITHUB_SHA:0:7}" \
            --notes-file release-notes.md --latest
          printf 'Download: https://github.com/%s/releases/download/%s/Tales-of-Leighneron.apk\n' "$GITHUB_REPOSITORY" "$release_tag" >> "$GITHUB_STEP_SUMMARY"
