name: Publish Android APK to itch.io

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Android release tag (leave blank to publish the latest)'
        required: false
        type: string
  workflow_run:
    workflows: ['Build and publish Android APK']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-itch-android
  cancel-in-progress: false

jobs:
  publish:
    name: Upload existing APK to itch.io
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check itch.io authentication
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${BUTLER_API_KEY:-}" ]]; then
            echo '::notice::itch.io upload skipped: add the BUTLER_API_KEY repository Actions secret, then manually run this workflow.'
            echo 'ITCH_UPLOAD_ENABLED=false' >> "$GITHUB_ENV"
          else
            echo 'ITCH_UPLOAD_ENABLED=true' >> "$GITHUB_ENV"
          fi

      - name: Download the exact published Android APK
        if: env.ITCH_UPLOAD_ENABLED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
            tag="android-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi
          if [[ ! "$tag" =~ ^android-[0-9]+-[0-9]+$ ]]; then
            echo '::error::Expected an android-RUN_ID-ATTEMPT release tag.'
            exit 1
          fi
          target="$RUNNER_TEMP/itch-android"
          mkdir -p "$target"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'Tales-of-Leighneron.apk*' --dir "$target"
          (cd "$target" && sha256sum --check Tales-of-Leighneron.apk.sha256)
          [[ -s "$target/Tales-of-Leighneron.apk" ]]
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Verified source APK from GitHub release $tag"

      - name: Install official itch.io butler
        if: env.ITCH_UPLOAD_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 -o "$RUNNER_TEMP/butler.zip" \
            'https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default'
          mkdir -p "$RUNNER_TEMP/itch-butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/itch-butler"
          chmod +x "$RUNNER_TEMP/itch-butler/butler"
          "$RUNNER_TEMP/itch-butler/butler" --version

      - name: Publish the APK to itch.io (Android channel)
        if: env.ITCH_UPLOAD_ENABLED == 'true'
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          version="1.0-${RELEASE_TAG#android-}"
          "$RUNNER_TEMP/itch-butler/butler" push \
            "$RUNNER_TEMP/itch-android/Tales-of-Leighneron.apk" \
            'zukiaoki/tales-of-leighneron:android' \
            --userversion "$version"
          echo '## Android upload to itch.io complete' >> "$GITHUB_STEP_SUMMARY"
          echo 'Published the verified APK from GitHub release `'$RELEASE_TAG'` to https://zukiaoki.itch.io/tales-of-leighneron (channel: android).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check your itch.io Edit Game page to ensure the download is enabled and the game page visibility is set as intended.' >> "$GITHUB_STEP_SUMMARY"
